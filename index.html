<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lessons Shop - Coach Login</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
    }

    .login-container {
      min-height: 100vh;
      background: white;
    }

    .form-input {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
    }

    .form-input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .btn-primary {
      background: #2563eb;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-primary:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    .error-message {
      color: #dc2626;
      font-size: 14px;
      margin-top: 4px;
    }

    .logo-img {
      width: 160px;
      height: 160px;
      object-fit: contain;
    }
  </style>
</head>

<body class="login-container">
  <div class="flex items-center justify-center min-h-screen px-4">
    <div class="w-full max-w-md">

      <!-- Logo and Brand -->
      <div class="text-center mb-8">
        <div class="flex justify-center mb-4">
          <img
            src="Lessonsshop updated logo.jpg"
            alt="Lessons Shop Logo"
            class="logo-img"
          />
        </div>

        <h1 class="text-3xl font-bold text-gray-900 mb-2">
          Lessons Shop
        </h1>

        <p class="text-gray-600">
          Coach Portal Access
        </p>
      </div>

      <!-- Coach Login -->
      <div class="bg-white rounded-2xl shadow-lg border border-gray-200 p-8">
        <div class="text-center mb-6">
          <div class="w-12 h-12 mx-auto mb-3 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xl">
            <i class="fas fa-chalkboard-user"></i>
          </div>

          <h2 class="text-2xl font-bold text-gray-900">
            Coach Sign In
          </h2>

          <p class="text-sm text-gray-600 mt-1">
            Sign in to manage students, lessons, notes, photos, and videos.
          </p>
        </div>

        <form id="coachForm">
          <div class="space-y-4">

            <div>
              <label
                for="coachEmail"
                class="block text-sm font-medium text-gray-900 mb-2"
              >
                Coach Email Address
              </label>

              <input
                type="email"
                id="coachEmail"
                placeholder="coach@email.com"
                class="form-input w-full"
                required
              />
            </div>

            <div>
              <label
                for="coachPassword"
                class="block text-sm font-medium text-gray-900 mb-2"
              >
                Password
              </label>

              <div class="relative">
                <input
                  type="password"
                  id="coachPassword"
                  placeholder="Enter your password"
                  class="form-input w-full pr-12"
                  required
                />

                <button
                  type="button"
                  id="togglePasswordBtn"
                  class="absolute right-3 top-3 text-gray-500"
                  aria-label="Show or hide password"
                >
                  <i id="passwordIcon" class="fas fa-eye"></i>
                </button>
              </div>
            </div>

            <label class="flex items-center">
              <input
                id="rememberMe"
                type="checkbox"
                class="w-4 h-4 text-blue-600 rounded"
              />

              <span class="ml-2 text-sm text-gray-600">
                Remember me
              </span>
            </label>

            <button
              id="signInBtn"
              type="submit"
              class="btn-primary w-full"
            >
              Sign In
            </button>

            <p
              id="loginMessage"
              class="error-message hidden"
            ></p>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    "use strict";

    const coachForm = document.getElementById("coachForm");
    const coachPassword = document.getElementById("coachPassword");
    const togglePasswordBtn = document.getElementById(
      "togglePasswordBtn"
    );
    const passwordIcon = document.getElementById("passwordIcon");
    const signInBtn = document.getElementById("signInBtn");
    const loginMessage = document.getElementById("loginMessage");

    togglePasswordBtn.addEventListener("click", () => {
      const showingPassword =
        coachPassword.type === "text";

      coachPassword.type = showingPassword
        ? "password"
        : "text";

      passwordIcon.className = showingPassword
        ? "fas fa-eye"
        : "fas fa-eye-slash";
    });

    coachForm.addEventListener("submit", async event => {
      event.preventDefault();

      const email = document
        .getElementById("coachEmail")
        .value
        .trim();

      const password = coachPassword.value;

      loginMessage.classList.add("hidden");
      loginMessage.textContent = "";

      signInBtn.disabled = true;
      signInBtn.textContent = "Signing in...";

      const { error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        console.error("Supabase login error:", error);

        loginMessage.textContent =
          "The email address or password is incorrect.";

        loginMessage.classList.remove("hidden");

        signInBtn.disabled = false;
        signInBtn.textContent = "Sign In";
        return;
      }

      window.location.href = "coach-portal.html";
    });
  </script>
</body>
</html>
